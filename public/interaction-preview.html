<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>냥비하지말개 PNG 이펙트 미리보기</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #29272a;
        background:
          radial-gradient(circle at 20% 0%, rgba(255, 231, 238, 0.7), transparent 34%),
          linear-gradient(180deg, #fff 0%, #fff8fa 100%);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(960px, 100%);
        margin: 0 auto;
        padding: 32px 18px 44px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 5vw, 38px);
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: #80767b;
        font-size: 15px;
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 18px;
      }

      .card {
        display: grid;
        gap: 18px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #f2d9e2;
        border-radius: 24px;
        box-shadow: 0 18px 44px rgba(86, 48, 63, 0.1);
      }

      .card h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }

      .stage {
        position: relative;
        display: grid;
        width: min(100%, 330px);
        aspect-ratio: 1;
        place-items: center;
        justify-self: center;
        background: radial-gradient(circle, #fff4f7 0%, #fff8fa 68%, rgba(255, 255, 255, 0) 69%);
        border-radius: 50%;
      }

      .character {
        position: relative;
        width: 78%;
        aspect-ratio: 1;
        animation: idle 3.2s ease-in-out infinite;
        transform-origin: 50% 84%;
      }

      .character.pop {
        animation: pop 620ms cubic-bezier(0.2, 0.9, 0.2, 1);
      }

      .character.shake {
        animation: shake 560ms ease-in-out;
      }

      .character img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .body {
        z-index: 0;
      }

      .effect {
        z-index: 1;
        pointer-events: none;
      }

      .effect::before,
      .effect::after {
        position: absolute;
        content: "";
      }

      .effect.happy::before,
      .effect.happy::after {
        color: #f16f97;
        content: "♥";
        filter: drop-shadow(0 5px 8px rgba(213, 76, 112, 0.18));
      }

      .effect.happy::before {
        top: 10%;
        left: 18%;
        font-size: 34px;
        transform: rotate(-12deg);
      }

      .effect.happy::after {
        top: 3%;
        right: 15%;
        font-size: 24px;
        transform: rotate(16deg);
      }

      .effect.sweat::before,
      .effect.sweat::after {
        width: 28px;
        height: 40px;
        background: #54c4ee;
        border-radius: 70% 70% 74% 74%;
        filter: drop-shadow(0 3px 4px rgba(54, 151, 199, 0.16));
        transform: rotate(25deg);
      }

      .effect.sweat::before {
        top: 10%;
        right: 18%;
      }

      .effect.sweat::after {
        top: 30%;
        right: 7%;
        width: 18px;
        height: 26px;
        opacity: 0.82;
      }

      .effect.angry::before {
        top: 0%;
        right: 12%;
        color: #ff352e;
        content: "♨";
        filter: drop-shadow(0 3px 0 rgba(74, 16, 16, 0.18));
        font-size: 44px;
        font-weight: 900;
        transform: rotate(8deg);
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      button {
        min-height: 42px;
        color: #8a3959;
        background: #fff;
        border: 1px solid #f0ccd8;
        border-radius: 999px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button.active {
        color: #fff;
        background: #df6b8d;
        border-color: #df6b8d;
        box-shadow: 0 8px 20px rgba(223, 107, 141, 0.22);
      }

      .note {
        min-height: 52px;
        padding: 12px 14px;
        color: #765b65;
        background: #fff7f9;
        border: 1px solid #f3d8e1;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.45;
      }

      @keyframes idle {
        0%,
        100% {
          transform: translateY(0) rotate(-0.5deg);
        }

        50% {
          transform: translateY(-8px) rotate(0.5deg);
        }
      }

      @keyframes pop {
        0% {
          transform: scale(0.96);
        }

        45% {
          transform: scale(1.07) translateY(-6px);
        }

        100% {
          transform: scale(1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        25% {
          transform: translateX(-6px) rotate(-2deg);
        }

        50% {
          transform: translateX(6px) rotate(2deg);
        }

        75% {
          transform: translateX(-4px) rotate(-1deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PNG 캐릭터 + 이펙트 미리보기</h1>
      <p>고퀄 캐릭터 PNG는 그대로 두고, 기분/포만도/성장 상태를 주변 이펙트와 크기 변화로 표현합니다.</p>

      <section class="grid" aria-label="캐릭터별 이펙트 미리보기">
        <article class="card" data-pet="akkigae">
          <h2>아끼개</h2>
          <div class="stage">
            <div class="character">
              <img class="body" src="/assets/pets/akkigae.png?v=2" alt="아끼개" />
              <span class="effect" aria-hidden="true"></span>
            </div>
          </div>
          <div class="controls" aria-label="아끼개 이펙트 선택"></div>
          <div class="note">normal: 원본 PNG를 그대로 보여줍니다.</div>
        </article>

        <article class="card" data-pet="ttoosseunyang">
          <h2>또쓰냥</h2>
          <div class="stage">
            <div class="character">
              <img class="body" src="/assets/pets/ttoosseunyang.png?v=2" alt="또쓰냥" />
              <span class="effect" aria-hidden="true"></span>
            </div>
          </div>
          <div class="controls" aria-label="또쓰냥 이펙트 선택"></div>
          <div class="note">normal: 원본 PNG를 그대로 보여줍니다.</div>
        </article>

        <article class="card" data-pet="kangchongmu">
          <h2>깡총무</h2>
          <div class="stage">
            <div class="character">
              <img class="body" src="/assets/pets/kangchongmu.png?v=1" alt="깡총무" />
              <span class="effect" aria-hidden="true"></span>
            </div>
          </div>
          <div class="controls" aria-label="깡총무 이펙트 선택"></div>
          <div class="note">normal: 원본 PNG를 그대로 보여줍니다.</div>
        </article>
      </section>
    </main>

    <script>
      const effects = [
        ["normal", "기본", 1],
        ["happy", "하트", 1.16],
        ["sweat", "땀", 0.88],
        ["angry", "분노", 0.94],
        ["small", "작게", 0.78],
        ["large", "크게", 1.2],
      ];

      const notes = {
        normal: "normal: 원본 PNG를 그대로 보여줍니다.",
        happy: "happy: 기록/보상 완료, 기분 좋음 상태는 하트 이펙트와 확대감으로 표현합니다.",
        sweat: "sweat: 포만도/기분이 낮을 때 캐릭터 얼굴을 바꾸지 않고 땀 이펙트만 얹습니다.",
        angry: "angry: 과소비/주의 상태는 분노 이펙트와 흔들림으로 표현합니다.",
        small: "small: 성장/재정 상태가 낮을 때 전체 캐릭터 크기를 줄입니다.",
        large: "large: 성장/기분이 높을 때 전체 캐릭터 크기를 키웁니다.",
      };

      document.querySelectorAll(".card").forEach((card) => {
        const petId = card.dataset.pet;
        const controls = card.querySelector(".controls");
        const effect = card.querySelector(".effect");
        const note = card.querySelector(".note");
        const character = card.querySelector(".character");
        const body = card.querySelector(".body");
        if (petId === "akkigae") body.src = "/assets/pets/akkigae.png?v=2";

        effects.forEach(([effectName, label, scale]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = label;
          button.className = effectName === "normal" ? "active" : "";
          button.addEventListener("click", () => {
            effect.className = `effect ${["happy", "sweat", "angry"].includes(effectName) ? effectName : ""}`;
            character.style.scale = scale;
            note.textContent = notes[effectName];
            controls.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
            button.classList.add("active");

            character.classList.remove("pop", "shake");
            void character.offsetWidth;
            character.classList.add(effectName === "angry" ? "shake" : "pop");
          });

          controls.appendChild(button);
        });
      });
    </script>
  </body>
</html>
